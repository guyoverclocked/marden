appId: app.marden.reader
productName: Marden
electronVersion: 43.1.1
asar: true
npmRebuild: false
files:
  - main.cjs
  - preload.cjs
  - package.json
extraResources:
  - from: ../dist
    to: dist
directories:
  output: ../artifacts
  buildResources: ../assets
fileAssociations:
  - ext:
      - md
      - markdown
      - mdown
      - mkd
    name: Markdown document
    role: Viewer
    rank: Alternate
# ── macOS ──────────────────────────────────────────────
mac:
  category: public.app-category.productivity
  icon: ../assets/icon.png
  electronLanguages:
    - en
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  artifactName: Marden-${version}-macOS-${arch}.${ext}
# ── Windows ────────────────────────────────────────────
win:
  icon: ../assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  artifactName: Marden-${version}-Windows-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
# ── Auto‑update (electron‑builder publishes metadata) ──
publish:
  provider: github
  owner: guyoverclocked
  repo: marden
  releaseType: release
dmg:
  title: Marden ${version}
  iconSize: 104
  contents:
    - x: 150
      y: 185
      type: file
    - x: 410
      y: 185
      type: link
      path: /Applications
